# ==============================================================================
# 动力学耦合强度消融实验配置文件（多任务版本）
# ==============================================================================
# 
# 本配置文件用于配置动力学耦合强度消融实验的相关参数
# 这个版本将任务拆分为：
# 1. 多尺度过滤任务（一次性生成拉普拉斯矩阵族）
# 2. 多个动力学演化任务（每个耦合强度一个任务）
#

# ==============================================================================
# 1. 数据路径配置
# ==============================================================================
paths:
  # 原始数据路径
  data_path: "/mnt/gs21/scratch/jiangj33/ldx/CHB-MIT/1.0.0"
  
  # 数据集名称
  dataset_name: "CHB-MIT"
  
  # 保存coff相关系数矩阵路径
  correlation_matrix_path: "/mnt/gs21/scratch/jiangj33/ldx/case21/output_chb23/similarity.npy"
  
  # 拉普拉斯矩阵族保存路径（多尺度过滤脚本的输出）
  laplacian_output_path: "/mnt/gs21/scratch/jiangj33/ldx/case21/output/output-xyz-multich23/laplacian-3k-10scale"
  
  # 保存耦合强度实验结果的基础路径
  output_base_path: "/mnt/gs21/scratch/jiangj33/ldx/case21/output/output-xyz-multi-3k-10scalech23"



# ==============================================================================
# 2. 实验参数配置
# ==============================================================================
experiment:
  # 耦合强度区间：从0到20，步长0.5
  coupling_strength:
    start: 0.0
    end: 20.0
    step: 0.5
  
  # K 为拉普拉斯尺度划分数量，默认为10
  K: 10
  
  # 是否提取特征，默认为否（如果为是，会保存dynamics_data.npy和features_scale_*.npy到data目录）
  # 注意：trajectories.npy 总是会保存，不受此参数影响
  extract_features: false
  
  # 是否保存cutoff文件，默认为否（如果为是，会保存cutoff_1.npy到cutoff_K.npy到输出目录）
  save_cutoff: false
  
  # 是否绘制cutoff图像，默认为是（每完成一个cutoff就绘制一次，保存到figures目录）
  plot_cutoff: true
  
  # 是否跳过已完成的实验，默认为是（中断续训功能）
  skip_completed: true

# ==============================================================================
# 3. 拉普拉斯矩阵参数
# ==============================================================================
laplacian:
  # 高斯核参数（用于计算邻接矩阵）
  sigma: 3.0

# ==============================================================================
# 4. 动力学分析参数
# ==============================================================================
dynamics:
  # 振荡器参数 (Lorenz系统)
  oscillator:
    type: "Lorenz"
    alpha: 10.0             # σ参数
    beta: 2.666666          # β参数 (8/3)
    gamma: 60.0             # ρ参数
    rk: 7.0                 # 周期性边界耦合系数
  
  # 数值积分参数
  numerical:
    method: "RK4"           # 求解方法: Euler, RK4
    time_step: 1.0e-3       # 时间步长 h
    coupling_mode: "xyz_all" # 耦合模式: x_only(全局网络x方向耦合), xyz_all(3分量直积单位矩阵耦合), nearest_neighbor(最近邻扩散耦合)
    use_periodic_boundary: false  # 是否使用周期性边界
  
  # 分析参数
  analysis:
    time_steps: 3000       # 总时间步数
    transient_steps: 2000   # 暂态步数 (丢弃)
    max_nodes: 4864    # 每尺度最大节点数
  
  # 采样参数
  sampling:
    method: "hybrid"        # 采样方法: random, uniform, hybrid
    hybrid_ratio: 0.3       # 混合采样中随机采样比例
  
  # 特征提取参数（已禁用，只保存轨迹数据）
  features:
    enable_chaos: false     # 是否提取混沌特征（Lyapunov指数）
    enable_sync: false      # 是否提取同步特征（与中心节点的相关系数）
  
  # 初始值范围
  initial_values:
    x_min: -10.0
    x_max: 10.0
    y_min: -10.0
    y_max: 10.0
    z_min: 0.0
    z_max: 50.0
  
  # 数值稳定性控制
  stability:
    state_clip_min: -200.0
    state_clip_max: 200.0
    dynamics_clip_min: -5000.0
    dynamics_clip_max: 5000.0

# ==============================================================================
# 5. 并行处理参数
# ==============================================================================
parallel:
  n_jobs: -1                # CPU核心数: -1表示使用所有核心
  max_jobs: 100               # 最大核心数限制

# ==============================================================================
# 6. 日志配置
# ==============================================================================
logging:
  level: "INFO"             # 日志级别: DEBUG, INFO, WARNING, ERROR
  save_to_file: true        # 是否保存日志到文件
