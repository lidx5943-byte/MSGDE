# LSTM/RNN 训练配置文件

# 输入数据路径
# 如果数据是多尺度的，形状为 (n_scales, n_samples, timesteps, features)，例如 (10, 100, 1001, 3)
# 如果数据是单尺度的，形状为 (n_samples, timesteps, features)，例如 (100, 100, 3)
input_data: "/mnt/gs21/scratch/jiangj33/ldx/case17/output-xyz-multi-3k-10scale/newdeli-0.0/data/trajectories.npy"

# 标签数据路径（支持 .xlsx 或 .npy 格式）
label: "/mnt/gs21/scratch/jiangj33/ldx/case17/newdeli_training_data_labels.npy"  # Excel文件，包含 'label' 列，形状为 (n_samples,)
# label: "eeg_label.npy"  # 或者使用numpy文件，形状为 (n_samples,)

# 选择的尺度K (仅当输入数据是多尺度时使用，0到n_scales-1)
# 如果输入数据是单尺度的，此参数将被忽略
scale_k: 0

# 数据预处理方式
preprocessing: "standardize"  # "standardize" 或 "normalize" 或 "none"

# n折交叉验证
n_folds: 10

# 实验名称
experiment_name: "lstm_rnn_experiment_newdeli-0.0_scale0"

# 输出路径
output_path: "./results"

# 随机数种子
random_state: 42

# RNN模型参数
rnn:
  model_type: "SimpleRNN"  # "SimpleRNN" 或 "LSTM"
  units_first: 128  # 第一层RNN单元数
  units_second: 256  # 第二层RNN单元数（如果使用堆叠）
  activation: "tanh"  # 激活函数
  dropout_rate: 0.2  # Dropout比率
  dense_units: 256  # 全连接层单元数
  dense_activation: "relu"  # 全连接层激活函数
  num_classes: 2  # 分类类别数
  use_stacked: true  # 是否使用堆叠RNN层

# LSTM模型参数
lstm:
  units_first: 128  # 第一层LSTM单元数
  units_second: 256  # 第二层LSTM单元数（如果使用堆叠）
  activation: "tanh"  # 激活函数
  dropout_rate: 0.2  # Dropout比率
  dense_units: 256  # 全连接层单元数
  dense_activation: "relu"  # 全连接层激活函数
  num_classes: 2  # 分类类别数
  use_stacked: true  # 是否使用堆叠LSTM层

# 训练参数
training:
  epochs: 50  # 训练轮次
  batch_size: 32  # 批次大小
  learning_rate: 0.0003  # 初始学习率
  optimizer: "Adam"  # 优化器
  early_stopping:
    monitor: "val_loss"  # 监控指标
    patience: 5  # 早停耐心值
    restore_best_weights: true  # 是否恢复最佳权重
  learning_rate_scheduler:
    enabled: true  # 是否启用学习率调度
    decay_epoch: 20  # 学习率衰减的epoch
    decay_factor: 0.8  # 学习率衰减因子

