# 机器学习训练配置文件

# 输入数据路径
input_data: "/mnt/gs21/scratch/jiangj33/ldx/case1/output-xyz-multi-3k-10scale/Bonn-0.0/data/trajectories.npy"  # 形状为 (10, 200, 1001, 3)
